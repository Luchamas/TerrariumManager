<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' photo: blob: data:; connect-src 'self'">
  <title>Terrarium Manager</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="catalog.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path class="jar" d="M20 8h24v6c8 4 12 11 12 20v14c0 6-4 10-10 10H18c-6 0-10-4-10-10V34c0-9 4-16 12-20z"/>
          <path class="soil" d="M9.5 46h45v2c0 5-3.5 8-8.5 8H18c-5 0-8.5-3-8.5-8z"/>
          <path class="leaf" d="M32 46c0-10 3-16 12-19-1 9-5 14-12 15"/>
          <path class="leaf" d="M32 46c0-7-3-12-10-14 0 7 4 11 10 12"/>
        </svg>
        <span class="brand-name">Terrarium<br>Manager</span>
      </div>
      <nav class="nav" aria-label="Seções">
        <a href="#shelf" data-view="shelf">Na prateleira <span class="nav-count" data-count="shelf"></span></a>
        <a href="#sold" data-view="sold">Vendidos <span class="nav-count" data-count="sold"></span></a>
        <a href="#buyers" data-view="buyers">Compradores <span class="nav-count" data-count="buyers"></span></a>
        <a href="#catalog" data-view="catalog">Catálogo Rápido</a>
        <a href="#overview" data-view="overview">Visão geral</a>
      </nav>
      <nav class="nav nav-bottom" aria-label="Aplicativo">
        <a href="#settings" data-view="settings">Configurações</a>
      </nav>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
